services:
  odyssey:
    build: .
    container_name: odyssey-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - odyssey-auth:/app/auth_info_baileys
    env_file:
      - .env
    networks:
      - default
      - liaw-shared

volumes:
  odyssey-auth:

networks:
  liaw-shared:
    external: true
